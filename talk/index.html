<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a10">
  <meta name="description" content="Kendi hızında İngilizce konuş. FatedReel Talk, sabırlı sesli İngilizce öğretmenin.">
  <title>Talk · FatedReel</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/talk/talk.css">
</head>
<body>
  <header><a class="brand" href="/">fatedreel<span>/ talk</span></a><span class="level">A1–A2 · English</span></header>
  <main>
    <section class="conversation" aria-label="Sesli İngilizce pratiği">
      <p class="eyebrow">SENİN HIZINDA BİR SOHBET</p>
      <div id="orb" class="orb" data-state="idle" aria-hidden="true"><div class="orb-core"></div></div>
      <h1 id="status" role="status" aria-live="polite">Acele etme.</h1>
      <p id="hint" class="hint">Düşün, duraksa, yeniden dene.<br>İngilizce konuşmak için buradayız.</p>
      <p id="error" class="error" role="alert" hidden></p>
      <form id="access-form" hidden><label for="access">Kişisel erişim kodun</label><input id="access" type="password" autocomplete="current-password" maxlength="256" required><button type="submit">Devam et</button></form>
      <button id="start" class="primary" disabled>Hazırlanıyor…</button>
      <div id="controls" class="controls" hidden><button id="mute" aria-pressed="false">Mikrofonu kapat</button><button id="finish">Bitirdim</button><button id="stop" class="stop">Sohbeti bitir</button></div>
      <button id="audio" hidden>Sesi aç</button>
      <button id="toggle" class="text-button" aria-expanded="false" aria-controls="transcript">Yazıyı göster</button>
      <section id="transcript" aria-label="Konuşma dökümü" hidden><p class="empty">Konuşmaların burada görünecek.</p><div id="messages" role="log" aria-live="polite"></div></section>
    </section>
  </main>
  <footer>Biraz düşünmek de konuşmanın bir parçası.<span>Sesin, sohbet için LiveKit ve OpenAI tarafından işlenir.</span></footer>
  <div id="remote-audio"></div>
  <script type="module" src="/talk/talk.js"></script>
</body>
</html>
