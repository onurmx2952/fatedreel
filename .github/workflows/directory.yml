name: Update page directory
on:
  push:
    branches: [main]
    paths-ignore:
      - 'icindekiler/index.html'
      - 'icindekiler/sites.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: page-directory
  cancel-in-progress: false
jobs:
  directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/build-directory.py
      - name: Commit updated directory
        run: |
          git config user.name "FatedReel Directory"
          git config user.email "directory@users.noreply.github.com"
          git add icindekiler/index.html icindekiler/sites.json
          if ! git diff --cached --quiet; then
            git commit -m "Update page directory"
            git push origin HEAD:main
          fi
